<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>고객컨설팅 마스터 과정</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0b0f1a;--surface:#131929;--surface2:#1b2338;--border:#232f4b;
  --accent:#3b82f6;--accent2:#06b6d4;--gold:#f59e0b;--gold2:#fbbf24;
  --green:#10b981;--red:#ef4444;--text:#e2e8f0;--muted:#64748b;--dim:#94a3b8;
  --purple:#8b5cf6;--purple2:#a78bfa;--teal:#0d9488;--teal2:#2dd4bf;
  --orange:#f97316;--orange2:#fb923c;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(59,130,246,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.04) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0;}

/* ── AUTH ── */
#screen-auth{display:none;position:fixed;inset:0;z-index:200;align-items:center;justify-content:center;padding:24px;background:var(--bg);}
#screen-auth.active{display:flex;}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:400px;position:relative;overflow:hidden;}
.auth-card::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(6,182,212,.15),transparent 70%);pointer-events:none;}
.auth-logo{display:flex;align-items:center;gap:8px;margin-bottom:24px;}
.auth-logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite;}
.auth-logo span{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent2);}
.auth-title{font-size:22px;font-weight:900;letter-spacing:-.02em;margin-bottom:5px;background:linear-gradient(135deg,#fff 40%,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6;}
.auth-tabs{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px;margin-bottom:20px;}
.auth-tab{flex:1;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;color:var(--muted);background:transparent;border:none;border-radius:7px;padding:9px;cursor:pointer;transition:.2s;}
.auth-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.06em;margin-bottom:5px;}
.field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;}
.field input:focus{border-color:var(--accent2);}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;padding:13px;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;color:#fff;cursor:pointer;transition:opacity .2s;margin-top:4px;}
.btn-primary:hover{opacity:.88;}
.auth-msg{margin-top:12px;font-size:13px;text-align:center;min-height:18px;}
.msg-err{color:var(--red);}
.auth-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.7;}

/* ── APP LAYOUT ── */
#screen-app{display:none;flex-direction:column;height:100%;}
#screen-app.active{display:flex;}
#fixed-top{position:relative;z-index:20;flex-shrink:0;}
#scroll-area{flex:1;overflow-y:auto;padding:0 20px 32px;-webkit-overflow-scrolling:touch;position:relative;z-index:10;}

/* ── HEADER ── */
header{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(59,130,246,.06),transparent);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--accent2);background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.25);border-radius:4px;padding:3px 8px;margin-bottom:6px;}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite;}
h1{font-size:clamp(18px,3vw,24px);font-weight:900;letter-spacing:-.02em;background:linear-gradient(135deg,#fff 30%,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.header-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}

/* ── STAT CHIPS ── */
.stat-row{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--border);}
.stat-chip{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;text-align:center;}
.stat-chip .num{font-family:'DM Mono',monospace;font-size:17px;font-weight:500;color:var(--accent2);}
.stat-chip .lbl{font-size:10px;color:var(--muted);margin-top:2px;}
.stat-chip.stat-clickable{cursor:pointer;transition:.2s;}
.stat-chip.stat-clickable:hover{border-color:var(--accent2);background:rgba(6,182,212,.07);}
.user-chip{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 12px;font-size:12px;display:flex;align-items:center;gap:6px;}
.user-chip .role{font-size:10px;color:var(--accent2);font-weight:700;letter-spacing:.06em;}
.btn-logout{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-family:'Noto Sans KR',sans-serif;font-size:11px;color:var(--muted);cursor:pointer;transition:.2s;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}

/* ── KPI BAR ── */
#my-kpi{padding:10px 20px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,rgba(139,92,246,.07),rgba(6,182,212,.04));}
.kpi-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--purple2);margin-bottom:8px;}
.kpi-cards{display:flex;gap:7px;flex-wrap:wrap;}
.kpi-card{background:var(--surface);border:1px solid rgba(139,92,246,.3);border-radius:9px;padding:9px 13px;}
.kpi-card .kl{font-size:10px;color:var(--muted);margin-bottom:3px;}
.kpi-card .kv{font-family:'DM Mono',monospace;font-size:16px;font-weight:700;line-height:1.1;}

/* ── 응원 배너 ── */
#cheer-banner{display:none;padding:8px 20px;flex-shrink:0;}
.banner-inner{border-radius:10px;padding:10px 14px;text-align:center;}
.banner-emojis{display:flex;gap:6px;justify-content:center;margin-bottom:5px;}
.banner-emojis span{font-size:22px;}
.banner-text{font-size:13px;font-weight:700;}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.banner-anim{animation:slideDown .4s ease;}

/* ── TABS ── */
.tab-nav{display:flex;gap:3px;padding:10px 20px 0;flex-wrap:wrap;}
.tab-btn{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;color:var(--muted);background:transparent;border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;padding:8px 14px;cursor:pointer;transition:.2s;position:relative;bottom:-1px;}
.tab-btn:hover{color:var(--dim);}
.tab-btn.active{color:var(--text);background:var(--surface);border-color:var(--border);border-bottom-color:var(--surface);}

/* ── PANELS ── */
.tab-panel{display:none;border:1px solid var(--border);border-radius:0 10px 10px 10px;background:var(--surface);overflow:hidden;animation:fadeIn .2s ease;}
.tab-panel.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── TABLE ── */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:var(--surface2);border-bottom:1px solid var(--border);}
thead th{padding:11px 13px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--muted);white-space:nowrap;}
thead th:first-child{padding-left:16px;}
thead th:last-child{padding-right:16px;}
tbody tr{border-bottom:1px solid rgba(35,47,75,.6);transition:background .15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(59,130,246,.04);}
tbody tr.me-row{background:rgba(139,92,246,.1);border-left:3px solid var(--purple2);}
td{padding:12px 13px;vertical-align:middle;white-space:nowrap;}
td:first-child{padding-left:16px;}
td:last-child{padding-right:16px;}
.table-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border);background:var(--surface2);font-size:11px;color:var(--muted);}

/* ── CELLS ── */
.cell-name{font-weight:600;color:#fff;white-space:nowrap;}
.cell-code{font-family:'DM Mono',monospace;font-size:12px;color:var(--dim);}
.cell-num{font-family:'DM Mono',monospace;font-size:13px;}
.progress-wrap{display:flex;align-items:center;gap:7px;min-width:140px;}
.progress-bar{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;}
.rate-badge{font-family:'DM Mono',monospace;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;}
.rate-high{background:rgba(16,185,129,.15);color:#10b981;}
.rate-mid{background:rgba(245,158,11,.15);color:#f59e0b;}
.rate-low{background:rgba(239,68,68,.12);color:#ef4444;}

/* ── 비고 배지 ── */
.bigo{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;}
.b300{background:rgba(239,68,68,.18);color:#f87171;border:1px solid rgba(239,68,68,.4);}
.b200{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.3);}
.b150{background:rgba(245,158,11,.15);color:var(--gold2);border:1px solid rgba(245,158,11,.3);}
.b120{background:rgba(6,182,212,.12);color:var(--accent2);border:1px solid rgba(6,182,212,.3);}
.b100{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3);}

/* ── DB/OK 셀 ── */
.db-num{font-family:'DM Mono',monospace;font-size:14px;color:var(--teal2);}
.db-zero{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);}
.lms-wrap{display:flex;align-items:center;gap:7px;min-width:120px;}
.lms-bar{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;}
.lms-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--teal2));}
.lms-lbl{font-family:'DM Mono',monospace;font-size:11px;min-width:38px;text-align:right;}
.count-badge{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:var(--purple2);}
.count-zero{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);}

/* ── 공지 ── */
.nitem{background:var(--surface2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:border-color .2s;}
.nitem:hover{border-color:var(--orange2);}
.nitem.pinned{border-color:rgba(249,115,22,.4);}
.nhead{display:flex;align-items:center;gap:8px;padding:13px 16px;cursor:pointer;}
.npin{background:rgba(249,115,22,.15);color:var(--orange2);font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid rgba(249,115,22,.3);flex-shrink:0;}
.nnew{background:rgba(239,68,68,.15);color:#f87171;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0;animation:nblink 1.5s infinite;}
@keyframes nblink{0%,100%{opacity:1}50%{opacity:.4}}
.ntitle{font-size:13px;font-weight:700;flex:1;color:var(--text);}
.ndate{font-size:11px;color:var(--muted);flex-shrink:0;}
.narrow{font-size:12px;color:var(--muted);transition:transform .25s;margin-left:4px;}
.narrow.open{transform:rotate(180deg);}
.nbody{display:none;padding:0 16px 14px;border-top:1px solid var(--border);}
.nbody.open{display:block;}
.nbody-inner{padding-top:12px;font-size:13px;color:var(--dim);line-height:1.9;white-space:pre-wrap;}

/* ── 모달 ── */
#modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;backdrop-filter:blur(4px);}
#modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:101;width:min(560px,94vw);max-height:82vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px;}

/* ── confetti ── */
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;display:none;}

/* ── 관리자 섹션 ── */
.admin-section{padding:22px;}
.admin-section+.admin-section{border-top:1px solid var(--border);}
.admin-section h3{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:14px;}
.upload-status{margin-top:10px;font-size:13px;min-height:18px;}
.csv-guide{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:12px;font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);line-height:1.9;}

@media(max-width:600px){
  .tab-btn{font-size:11px;padding:7px 10px;}
}
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>

<!-- ── 로그인 ── -->
<div id="screen-auth" class="active">
  <div class="auth-card">
    <div class="auth-logo"><div class="dot"></div><span>MASTER COURSE 2026</span></div>
    <div class="auth-title">고객컨설팅<br>마스터 과정</div>
    <div class="auth-sub">진도 현황 대시보드<br>사번을 입력하여 입장하세요</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('member')">설계사 입장</button>
      <button class="auth-tab" onclick="switchAuthTab('admin')">관리자</button>
    </div>
    <div id="auth-member">
      <div class="field"><label>사번</label>
        <input type="text" id="m-code" placeholder="사번 입력" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <button class="btn-primary" onclick="doLogin()">입장하기</button>
      <div class="auth-msg" id="member-msg"></div>
      <div class="auth-hint">사번이 일치하면 바로 입장됩니다</div>
    </div>
    <div id="auth-admin" style="display:none;">
      <div class="field"><label>관리자 코드</label>
        <input type="password" id="a-code" placeholder="관리자 코드 입력" onkeydown="if(event.key==='Enter')doAdminLogin()"/>
      </div>
      <button class="btn-primary" onclick="doAdminLogin()">관리자 입장</button>
      <div class="auth-msg" id="admin-msg"></div>
    </div>
  </div>
</div>

<!-- ── 앱 ── -->
<div id="screen-app">

<div id="fixed-top">
<header>
  <div>
    <div class="badge">2026 · MASTER COURSE</div>
    <h1>고객컨설팅 마스터 과정</h1>
  </div>
  <div class="header-right">
    <div class="stat-chip stat-clickable" onclick="openModal('avg')"><div class="num" id="stat-avg">—</div><div class="lbl">평균 달성율 ↗</div></div>
    <div class="stat-chip stat-clickable" onclick="openModal('award1')"><div class="num" id="stat-a1">—</div><div class="lbl">기준달성 ↗</div></div>
    <div class="stat-chip stat-clickable" onclick="openModal('award2')"><div class="num" id="stat-a2">—</div><div class="lbl">곱빼기달성 ↗</div></div>
    <div class="user-chip"><span id="header-name">—</span><span class="role" id="header-role">—</span></div>
    <button onclick="loadFromSheet()" style="background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:7px 12px;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:600;color:#10b981;cursor:pointer;transition:.2s;" onmouseover="this.style.background='rgba(16,185,129,.25)'" onmouseout="this.style.background='rgba(16,185,129,.15)'">🔄 새로고침</button>
    <button class="btn-logout" onclick="doLogout()">로그아웃</button>
  </div>
</header>

<!-- KPI -->
<div id="my-kpi" style="display:none;">
  <div class="kpi-label">✦ 나의 KPI</div>
  <div class="kpi-cards">
    <div class="kpi-card"><div class="kl">달성율</div><div class="kv" id="kpi-rate">—</div></div>
    <div class="kpi-card"><div class="kl">목표</div><div class="kv" style="font-size:13px;color:var(--dim)" id="kpi-target">—</div></div>
    <div class="kpi-card"><div class="kl">실적</div><div class="kv" style="font-size:13px;color:var(--accent2)" id="kpi-actual">—</div></div>
    <div class="kpi-card"><div class="kl">신규LMS</div><div class="kv" style="font-size:13px;color:var(--green)" id="kpi-lms">—</div></div>
    <div class="kpi-card"><div class="kl">행복보장</div><div class="kv" style="font-size:13px;color:var(--teal2)" id="kpi-happy">—</div></div>
    <div class="kpi-card"><div class="kl">응원</div><div class="kv" style="font-size:12px;" id="kpi-cheer">—</div></div>
  </div>
</div>

<!-- 응원 배너 -->
<div id="cheer-banner">
  <div class="banner-inner" id="banner-inner">
    <div class="banner-emojis" id="banner-emojis"></div>
    <div class="banner-text" id="banner-text"></div>
  </div>
</div>

<nav class="tab-nav" id="tab-nav"></nav>
</div><!-- /fixed-top -->

<!-- 스크롤 영역 -->
<div id="scroll-area">
<main id="main-panels"></main>
</div>

</div><!-- /screen-app -->

<!-- 모달 -->
<div id="modal-backdrop" onclick="closeModal()"></div>
<div id="modal">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;">
    <div>
      <div id="modal-title" style="font-size:17px;font-weight:800;"></div>
      <div id="modal-sub" style="font-size:12px;color:var(--muted);margin-top:3px;"></div>
    </div>
    <button onclick="closeModal()" style="background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:7px;padding:5px 11px;color:var(--dim);cursor:pointer;font-size:16px;">✕</button>
  </div>
  <div id="modal-body"></div>
</div>

<script>
// Firebase 미사용 (구글 시트 CSV 직접 연동)

// ══════════════════════════════════════════
const SHEET_CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT-j7irdQSuwF9CF_iQwkqJetOb0SOWGQA8DVt-VIV1-xwyGV2Tl5SdOwHLBt-79RJBOidxsABJoe1A/pub?output=csv';
const NOTICE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT-j7irdQSuwF9CF_iQwkqJetOb0SOWGQA8DVt-VIV1-xwyGV2Tl5SdOwHLBt-79RJBOidxsABJoe1A/pub?gid=1558845890&single=true&output=csv';
const ADMIN_CODE     = 'yy';
const firebaseConfig = {
  apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",
  projectId:"YOUR_PROJECT_ID",storageBucket:"YOUR_PROJECT.appspot.com",
  messagingSenderId:"YOUR_SENDER_ID",appId:"YOUR_APP_ID"
};
// ══════════════════════════════════════════

let DATA=[], currentSession=null;

// ── 금액 원단위
function wonFmt(n){if(!n||n===0)return'—';return n.toLocaleString()+'원';}

// ── 달성율
function getRate(m){return m.target>0?Math.round(m.actual/m.target*100):0;}
function rateColor(r){return r>=100?'#10b981':r>=70?'#f59e0b':'#ef4444';}
function progressGrad(r){
  if(r>=100)return'linear-gradient(90deg,#10b981,#34d399)';
  if(r>=70) return'linear-gradient(90deg,#f59e0b,#fbbf24)';
  return'linear-gradient(90deg,#ef4444,#f87171)';
}
function rateClass(r){return r>=100?'rate-high':r>=70?'rate-mid':'rate-low';}

// ── 비고
function getBigo(r){
  if(r>=300)return'<span class="bigo b300">🍺 술 사달라!</span>';
  if(r>=200)return'<span class="bigo b200">🎉 곱빼기 달성</span>';

// ── confetti
function launchConfetti(dur){
  const c=document.getElementById('confetti-canvas');
  c.style.display='block'; c.width=window.innerWidth; c.height=window.innerHeight;
  const ctx=c.getContext('2d');
  const clrs=['#3b82f6','#06b6d4','#10b981','#f59e0b','#8b5cf6','#ef4444','#fbbf24'];
  const p=Array.from({length:150},()=>({
    x:Math.random()*c.width,y:-10,w:5+Math.random()*8,h:3+Math.random()*4,
    color:clrs[Math.floor(Math.random()*clrs.length)],rot:Math.random()*360,
    vx:(Math.random()-.5)*5,vy:2+Math.random()*4,vr:(Math.random()-.5)*7,op:1
  }));
  const s=Date.now();
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    const el=Date.now()-s;
    p.forEach(q=>{
      q.x+=q.vx; q.y+=q.vy; q.rot+=q.vr;
      if(el>dur*.6) q.op=Math.max(0,1-(el-dur*.6)/(dur*.4));
      ctx.save(); ctx.globalAlpha=q.op; ctx.translate(q.x,q.y);
      ctx.rotate(q.rot*Math.PI/180); ctx.fillStyle=q.color;
      ctx.fillRect(-q.w/2,-q.h/2,q.w,q.h); ctx.restore();
    });
    if(el<dur) requestAnimationFrame(draw); else c.style.display='none';
  })();
}

// ── CSV 파싱
function parseCSV(text){
  return text.trim().split('\n').slice(1).map(line=>{
    const c=line.split(',').map(s=>s.trim());
    return {
      branch:c[0], name:c[1], code:c[2], month:c[3],
      target:+c[4], actual:+c[5],
      newLms:+c[6], actHappy:+c[7],
      design:+c[8], issued:+c[9],
      okCount:+c[10], okAmount:+c[11],
      품격Count:+c[12], 품격Amount:+c[13],
      dbProvide:+c[14], dbLms:+c[15],
      happyAnalysis:+c[16], dbDesign:+c[17],
      yesterday:+c[18]||0
    };
  }).filter(r=>r.name);
}

// ── 공지 CSV 파싱
function parseNoticeCSV(text){
  return text.trim().split('\n').slice(1).map((line,i)=>{
    const c=line.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
    return {id:i+1,title:c[0]||'',date:c[1]||'',pinned:c[2]?.toUpperCase()==='Y',isNew:c[3]?.toUpperCase()==='Y',content:c[4]||''};
  }).filter(n=>n.title);
}

// ── 활동 현황 (신규LMS 높은 순)
function renderActivity(panel){
  const myCode=currentSession?.code;
  const sorted=[...DATA].sort((a,b)=>b.newLms-a.newLms);
  const n=DATA.length||1;
  panel.innerHTML=`
    <div class="table-wrap"><table>
      <thead><tr><th>이름</th><th>신규LMS동의</th><th>행복보장분석</th><th>설계건수</th><th>발행건수</th></tr></thead>
      <tbody id="tb-act"></tbody>
      <tfoot id="tf-act"></tfoot>
    </table></div>
    <div class="table-footer"><span id="ft-act">—</span><span style="font-family:'DM Mono',monospace;font-size:10px">MASTER COURSE 2026</span></div>`;
  const tb=panel.querySelector('#tb-act');
  sorted.forEach(m=>{
    const isMe=currentSession?.role==='member'&&m.code===myCode;
    const tr=document.createElement('tr'); if(isMe)tr.className='me-row';
    tr.innerHTML=`
      <td><span style="font-weight:${isMe?900:600};font-size:${isMe?'15px':'13px'}">${m.name}${isMe?' <span style="font-size:10px;color:var(--purple2)">◀ 나</span>':''}</span></td>
      <td style="font-family:'DM Mono',monospace;color:var(--accent2)">${m.newLms}건</td>
      <td style="font-family:'DM Mono',monospace;color:var(--green)">${m.actHappy}건</td>
      <td style="font-family:'DM Mono',monospace">${m.design}건</td>
      <td style="font-family:'DM Mono',monospace">${m.issued}건</td>`;
    tb.appendChild(tr);
  });
  const avgL=(DATA.reduce((s,d)=>s+d.newLms,0)/n).toFixed(1);
  const avgH=(DATA.reduce((s,d)=>s+d.actHappy,0)/n).toFixed(1);
  const avgD=(DATA.reduce((s,d)=>s+d.design,0)/n).toFixed(1);
  const avgI=(DATA.reduce((s,d)=>s+d.issued,0)/n).toFixed(1);
  panel.querySelector('#tf-act').innerHTML=`
    <tr style="background:var(--surface2);border-top:2px solid var(--border)">
      <td style="padding:10px 13px;font-size:11px;font-weight:700;color:var(--dim)">평 균</td>
      <td style="padding:10px 13px;font-family:'DM Mono',monospace;font-weight:700;color:var(--accent2)">${avgL}건</td>
      <td style="padding:10px 13px;font-family:'DM Mono',monospace;font-weight:700;color:var(--green)">${avgH}건</td>
      <td style="padding:10px 13px;font-family:'DM Mono',monospace;font-weight:700;color:var(--dim)">${avgD}건</td>
      <td style="padding:10px 13px;font-family:'DM Mono',monospace;font-weight:700;color:var(--dim)">${avgI}건</td>
    </tr>`;
  panel.querySelector('#ft-act').textContent=DATA.length+'명';
}

// ── 제공DB (행복보장분석 높은 순)
function renderDB(panel){
  const myCode=currentSession?.code;
  const sorted=[...DATA].sort((a,b)=>b.happyAnalysis-a.happyAnalysis);
  panel.innerHTML=`
    <div class="table-wrap"><table>
      <thead><tr><th>이름</th><th>제공건수</th><th style="min-width:130px">DB LMS동의</th><th>행복보장분석</th><th>가입설계건수</th></tr></thead>
      <tbody id="tb-db"></tbody>
    </table></div>
    <div class="table-footer"><span id="ft-db">—</span><span style="font-family:'DM Mono',monospace;font-size:10px">MASTER COURSE 2026</span></div>`;
  const tb=panel.querySelector('#tb-db');
  sorted.forEach(m=>{
    const isMe=currentSession?.role==='member'&&m.code===myCode;
    const lc=m.dbLms>=80?'#10b981':m.dbLms>=60?'#f59e0b':'#ef4444';
    const tr=document.createElement('tr'); if(isMe)tr.className='me-row';
    tr.innerHTML=`
      <td><span style="font-weight:${isMe?900:600};font-size:${isMe?'15px':'13px'}">${m.name}${isMe?' <span style="font-size:10px;color:var(--purple2)">◀ 나</span>':''}</span></td>
      <td>${m.dbProvide>0?`<span class="db-num">${m.dbProvide}건</span>`:'<span class="db-zero">—</span>'}</td>
      <td><div class="lms-wrap"><div class="lms-bar"><div class="lms-fill" style="width:${Math.round(m.dbLms)}%"></div></div><span class="lms-lbl" style="color:${lc}">${m.dbLms.toFixed(1)}%</span></div></td>
      <td>${m.happyAnalysis>0?`<span class="db-num">${m.happyAnalysis}건</span>`:'<span class="db-zero">—</span>'}</td>
      <td>${m.dbDesign>0?`<span class="db-num">${m.dbDesign}건</span>`:'<span class="db-zero">—</span>'}</td>`;
    tb.appendChild(tr);
  });
  panel.querySelector('#ft-db').textContent=DATA.length+'명';
}

  const okA=DATA.reduce((s,d)=>s+d.okAmount,0);

      <thead><tr><th>이름</th><th>오케이플랜 건수</th><th>오케이플랜 금액</th><th>인생의품격 건수</th><th>인생의품격 금액</th></tr></thead>

  const tb=panel.querySelector('#tb-ok');
  sorted.forEach(m=>{
    const isMe=currentSession?.role==='member'&&m.code===myCode;
    const tr=document.createElement('tr'); if(isMe)tr.className='me-row';
    tr.innerHTML=`
      <td><span style="font-weight:${isMe?900:600};font-size:${isMe?'15px':'13px'}">${m.name}${isMe?' <span style="font-size:10px;color:var(--purple2)">◀ 나</span>':''}</span></td>
      <td style="font-family:'DM Mono',monospace;color:var(--purple2)">${m.okCount>0?m.okCount+'건':'<span style="color:var(--muted)">—</span>'}</td>
      <td style="font-family:'DM Mono',monospace;color:var(--purple2)">${m.okAmount>0?wonFmt(m.okAmount):'<span style="color:var(--muted)">—</span>'}</td>
      <td style="font-family:'DM Mono',monospace;color:var(--gold2)">${(m.품격Count||0)>0?m.품격Count+'건':'<span style="color:var(--muted)">—</span>'}</td>
      <td style="font-family:'DM Mono',monospace;color:var(--gold2)">${(m.품격Amount||0)>0?wonFmt(m.품격Amount):'<span style="color:var(--muted)">—</span>'}</td>`;

      <td style="padding:10px 13px;font-family:'DM Mono',monospace;font-weight:700;color:var(--purple2)">${wonFmt(okA)}</td>
      <td style="padding:10px 13px;font-family:'DM Mono',monospace;font-weight:700;color:var(--gold2)">${품C}건</td>
      <td style="padding:10px 13px;font-family:'DM Mono',monospace;font-weight:700;color:var(--gold2)">${wonFmt(품A)}</td>
    </tr>`;
  panel.querySelector('#ft-ok').textContent=DATA.length+'명 · 오케이 '+okC+'건 '+wonFmt(okA)+' · 품격 '+품C+'건 '+wonFmt(품A);

// ── 오늘의 실적
function renderToday(panel){
  const myCode=currentSession?.code;
  const today=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
  // 어제 대비 증가한 사람만 필터 (실적이 어제보다 늘어난 경우)
  const improved=DATA.filter(m=>(m.actual||0)>(m.yesterday||0))
    .sort((a,b)=>(b.actual-b.yesterday)-(a.actual-a.yesterday));
  const totalIncrease=improved.reduce((s,m)=>s+(m.actual-m.yesterday),0);

  panel.innerHTML=`
    <div style="padding:14px 16px 0;">
      <div style="background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(6,182,212,.08));border:1px solid rgba(16,185,129,.25);border-radius:12px;padding:14px 18px;margin-bottom:14px;">
        <div style="font-size:10px;font-weight:700;letter-spacing:.1em;color:#10b981;margin-bottom:8px;">🌟 ${today} 오늘의 실적 현황</div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;">
          <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">실적 증가 인원</div>
            <div style="font-family:'DM Mono',monospace;font-size:22px;font-weight:700;color:#10b981">${improved.length}<span style="font-size:12px;margin-left:3px;color:var(--muted)">명</span></div></div>
          <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">오늘 총 증가 실적</div>
            <div style="font-family:'DM Mono',monospace;font-size:22px;font-weight:700;color:var(--accent2)">${wonFmt(totalIncrease)}</div></div>
        </div>
      </div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>지점</th><th>이름</th>
        <th>어제 실적</th><th>오늘 실적</th>
        <th>증가액</th><th>달성율</th>
      </tr></thead>
      <tbody id="tb-today"></tbody>
    </table></div>
    <div class="table-footer">
      <span id="ft-today">—</span>
      <span style="font-family:'DM Mono',monospace;font-size:10px">MASTER COURSE 2026</span>
    </div>`;

  const tb=panel.querySelector('#tb-today');
  if(!improved.length){
    tb.innerHTML=`<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted);font-size:13px;">오늘 실적 변동이 없습니다.</td></tr>`;
  } else {
    improved.forEach(m=>{
      const diff=m.actual-(m.yesterday||0);
      const r=getRate(m);
      const isMe=currentSession?.role==='member'&&m.code===myCode;
      const tr=document.createElement('tr');
      if(isMe)tr.className='me-row';
      tr.innerHTML=`
        <td><span style="font-size:11px;color:var(--dim)">${m.branch}</span></td>
        <td><span style="font-weight:${isMe?900:600};font-size:${isMe?'15px':'13px'}">${m.name}${isMe?' <span style="font-size:10px;color:var(--purple2)">◀ 나</span>':''}</span></td>
        <td style="font-family:'DM Mono',monospace;color:var(--muted)">${wonFmt(m.yesterday||0)}</td>
        <td style="font-family:'DM Mono',monospace;color:${rateColor(r)};font-weight:${isMe?700:400}">${wonFmt(m.actual)}</td>
        <td>
          <span style="font-family:'DM Mono',monospace;font-size:13px;font-weight:700;color:#10b981">
            +${wonFmt(diff)}
          </span>
        </td>
        <td><span class="rate-badge ${rateClass(r)}">${r}%</span></td>`;
      tb.appendChild(tr);
    });
  }
  panel.querySelector('#ft-today').textContent=`${improved.length}명 실적 증가 · 총 +${wonFmt(totalIncrease)}`;
}

// ── 내 시상진도 보기
function renderAward(panel){
  const me=DATA.find(r=>r.code===currentSession?.code);
  if(!me){
    // 관리자: 인원 선택해서 볼 수 있게
    if(currentSession?.role==='admin'){
      panel.innerHTML=`
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;">
          <div style="font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--muted);margin-bottom:12px">👤 조회할 인원 선택</div>
          <select id="award-select" onchange="renderAwardFor(this.value)" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--text);outline:none;">
            <option value="">— 인원을 선택하세요 —</option>
            ${[...DATA].sort((a,b)=>b.actual-a.actual).map(m=>`<option value="${m.code}">${m.name} (${m.branch}) — 실적 ${wonFmt(m.actual)}</option>`).join('')}
          </select>
        </div>
        <div id="award-content"></div>`;
      return;
    }
    panel.innerHTML='<div style="padding:24px;text-align:center;color:var(--muted)">데이터를 불러오는 중...</div>';
    return;
  }

  const s=me.actual-me.target;
  const r=getRate(me);
  const sc=s>=0?'#10b981':'#ef4444';
  const rc=r>=200?'#ef4444':r>=150?'#fbbf24':r>=100?'#10b981':'#ef4444';

  // D-Day
  const deadline=new Date('2026-06-19');
  const dday=Math.max(0,Math.ceil((deadline-new Date())/(1000*60*60*24)));
  const dc=dday<=3?'#ef4444':dday<=7?'#f59e0b':'#fbbf24';

  // 순증 시상 구간
  const STEPS=[
    {min:1000000,label:'100만원↑',prize:'1,000천원',val:1000000,next:null},
    {min:500000, label:'50만원↑', prize:'500천원',  val:500000, next:1000000},
    {min:300000, label:'30만원↑', prize:'300천원',  val:300000, next:500000},
    {min:200000, label:'20만원↑', prize:'200천원',  val:200000, next:300000},
    {min:100000, label:'10만원↑', prize:'100천원',  val:100000, next:200000},
  ];
  const YU=[
    {min:1000000,label:'주유권 60만원',val:600000},
    {min:500000, label:'주유권 30만원',val:300000},
    {min:300000, label:'주유권 15만원',val:150000},
    {min:200000, label:'주유권 10만원',val:100000},
    {min:100000, label:'주유권 4만원', val:40000},
  ];
  const GOB=[
    {pct:300,label:'세곱빼기 300%',val:me.target},
    {pct:200,label:'곱빼기 200%',  val:Math.round(me.target*.5)},
    {pct:150,label:'150% 달성',   val:Math.round(me.target*.3)},
  ];
  const RANK_PRIZES=[
    {rank:'1위', label:'300천원',    val:300000,color:'#fbbf24'},
    {rank:'2위', label:'200천원',    val:200000,color:'#94a3b8'},
    {rank:'3위', label:'100천원',    val:100000,color:'#fb923c'},
    {rank:'4위', label:'올리브영 8만',val:80000, color:'#84cc16'},
    {rank:'5위', label:'올리브영 8만',val:80000, color:'#84cc16'},
    {rank:'6위', label:'올리브영 5만',val:50000, color:'#64748b'},
    {rank:'7위', label:'올리브영 5만',val:50000, color:'#64748b'},
    {rank:'8위', label:'올리브영 5만',val:50000, color:'#64748b'},
    {rank:'9위', label:'올리브영 5만',val:50000, color:'#64748b'},
    {rank:'10위',label:'올리브영 5만',val:50000, color:'#64748b'},
  ];

  const qualified=[...DATA].filter(d=>d.actual-d.target>=200000).sort((a,b)=>(b.actual-b.target)-(a.actual-a.target));
  qualified.forEach((m,i)=>{m._rk=i<RANK_PRIZES.length?RANK_PRIZES[i]:null;});
  DATA.forEach(m=>{if(!m._rk&&getRate(m)>=100&&m.actual-m.target<200000)m._rk={rank:'순위外',label:'올리브영 3만',val:30000,color:'#10b981'};});

  const curStep=STEPS.find(st=>s>=st.min)||null;
  const yuGift=YU.find(y=>s>=y.min)||null;
  const myQIdx=qualified.findIndex(m=>m.code===me.code);

  // 시상금 합산
  const spv=curStep?curStep.val:0;
  const yuv=yuGift?yuGift.val:0;
  const over40=me.actual>=400000;
  let gbv=0;
  if(r>=100&&over40){if(r>=300)gbv=me.target;else if(r>=200)gbv=Math.round(me.target*.5);else if(r>=150)gbv=Math.round(me.target*.3);}
  const rkv=me._rk?me._rk.val:0;
  const total=spv+yuv+gbv+rkv;

  const W=n=>`<span style="font-family:'DM Mono',monospace">${wonFmt(n)}</span>`;
  const TAG=(t,c,bg)=>`<span style="display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;background:${bg};color:${c};white-space:nowrap">${t}</span>`;
  const HINT=(left,right,color='#06b6d4')=>`<div style="background:var(--surface2);border-radius:8px;padding:9px 13px;font-size:12px;color:var(--dim);display:flex;align-items:center;justify-content:space-between;margin-top:6px;flex-wrap:wrap;gap:4px;"><span>${left}</span><span style="font-family:'DM Mono',monospace;font-weight:700;color:${color}">+${wonFmt(right)} 필요</span></div>`;
  const CARD=(label,val,color)=>`<div style="background:var(--surface2);border-radius:10px;padding:11px 12px;"><div style="font-size:10px;color:var(--muted);margin-bottom:4px">${label}</div><div style="font-family:'DM Mono',monospace;font-size:15px;font-weight:700;color:${val>0?color:'var(--muted)'};">${val>0?wonFmt(val):'—'}</div></div>`;
  const BAR=(pct,grad)=>`<div style="height:7px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin:5px 0;"><div style="height:100%;width:${Math.min(pct,100)}%;background:${grad};border-radius:99px;"></div></div>`;

  // 요약 HTML
  const summaryHtml=
    `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
      ${CARD('기준목표',me.target,'#94a3b8')}
      ${CARD('현재 실적',me.actual,'#06b6d4')}
      <div style="background:var(--surface2);border-radius:10px;padding:11px 12px;"><div style="font-size:10px;color:var(--muted);margin-bottom:4px">순증액</div><div style="font-family:'DM Mono',monospace;font-size:15px;font-weight:700;color:${sc}">${s>=0?'+':''}${wonFmt(s)}</div></div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:4px">달성율 <b style="color:${rc}">${r}%</b></div>
    ${BAR(Math.min(r,100),r>=100?'linear-gradient(90deg,#10b981,#34d399)':r>=70?'linear-gradient(90deg,#f59e0b,#fbbf24)':'linear-gradient(90deg,#ef4444,#f87171)')}`;

  // 순증 시상 HTML
  let spHtml='';
  if(s<100000){
    spHtml=`${TAG('순증 10만원 미달','#94a3b8','rgba(100,116,139,.12)')}
      ${HINT('10만원 순증 시상까지',100000-s)}
      ${HINT('20만원 순위시상 조건까지',200000-s)}`;
  } else {
    const barNext=curStep.next||curStep.min*2;
    const pct=Math.round((s-curStep.min)/(barNext-curStep.min)*100);
    spHtml=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">
        <span style="font-size:13px;font-weight:700">현재 구간</span>
        ${TAG(curStep.label+' — '+curStep.prize,'#fbbf24','rgba(251,191,36,.12)')}
      </div>
      <div style="font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:3px"><span>현재 ${wonFmt(s)}</span><span>${curStep.next?'다음 '+wonFmt(curStep.next):'최고 구간!'}</span></div>
      ${BAR(pct,'linear-gradient(90deg,#f59e0b,#fbbf24)')}
      ${curStep.next?HINT('다음 구간까지',curStep.next-s,'#fbbf24'):'<div style="font-size:12px;color:#fbbf24;margin-top:6px">🎉 최고 시상 구간 달성!</div>'}
      ${yuGift?`<div style="margin-top:8px;padding:9px 13px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.2);border-radius:8px;font-size:12px;color:#fbbf24">⏰ 6월 19일 조기마감 달성 시 <b>${yuGift.label}</b> 추가</div>`:''}`;
  }

  // 곱빼기 시상 HTML
  let gobHtml='';
  if(r<100){
    gobHtml=`<div style="font-size:12px;color:var(--muted)">기준 달성(100%) 후 해당됩니다.</div>${HINT('기준 달성까지',me.target-me.actual)}`;
  } else {
    if(!over40) gobHtml+=`<div style="padding:9px 13px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);border-radius:8px;font-size:12px;color:#fbbf24;margin-bottom:10px">⚠️ 곱빼기 시상은 최종 실적 40만원↑ 조건 — 현재 ${wonFmt(me.actual)} (${wonFmt(400000-me.actual)} 더 필요)</div>`;
    GOB.forEach(g=>{
      const need=Math.round(me.target*g.pct/100);
      const done=me.actual>=need;
      const pct2=Math.min(Math.round(me.actual/need*100),100);
      gobHtml+=`<div style="background:var(--surface2);border:1px solid ${done?'rgba(16,185,129,.3)':'var(--border)'};border-radius:10px;padding:12px;margin-bottom:8px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:6px">
          <span style="font-size:12px;font-weight:700;color:${done?'#10b981':'var(--dim)'}">${done?'✅ ':'⬜ '}${g.label}</span>
          <span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;background:${done?'rgba(16,185,129,.15)':'rgba(167,139,250,.12)'};color:${done?'#10b981':'#a78bfa'}">추가 시상 ${wonFmt(g.val)}</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px">필요 실적 ${wonFmt(need)} ${done?'<span style="color:#10b981">✓ 달성!</span>':'<span style="color:#06b6d4">— +'+wonFmt(need-me.actual)+' 필요</span>'}</div>
        ${BAR(pct2,done?'linear-gradient(90deg,#10b981,#34d399)':'linear-gradient(90deg,#3b82f6,#06b6d4)')}
      </div>`;
    });
  }

  // 순위 시상 HTML
  let rkHtml='';
  if(s<200000){
    rkHtml=`<div style="padding:9px 13px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);border-radius:8px;font-size:12px;color:#fbbf24;margin-bottom:10px">순위 시상 조건: 순증 20만원↑ — <b>${wonFmt(200000-s)} 더 필요</b></div>`;
  } else {
    const myRk=me._rk;
    rkHtml+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px">
      <span style="font-size:13px;font-weight:700">현재 순위</span>
      ${TAG((myQIdx+1)+'위 — '+(myRk?myRk.label:'—'),myRk?myRk.color:'#64748b',`rgba(0,0,0,.2)`)}
    </div>`;
  }
  rkHtml+=`<div style="font-size:11px;color:var(--muted);margin-bottom:8px">순증 20만원↑ 달성자 순위표</div>
    <table style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead><tr style="background:var(--surface2);border-bottom:1px solid var(--border)">
        <th style="padding:8px 10px;text-align:left;font-size:10px;color:var(--muted)">순위</th>
        <th style="padding:8px 10px;text-align:left;font-size:10px;color:var(--muted)">이름</th>
        <th style="padding:8px 10px;text-align:left;font-size:10px;color:var(--muted)">순증액</th>
        <th style="padding:8px 10px;text-align:left;font-size:10px;color:var(--muted)">순위 시상</th>
      </tr></thead><tbody>`;
  qualified.forEach((m,i)=>{
    const isMe=m.code===me.code;
    const rk=RANK_PRIZES[i]||{label:'—',color:'#64748b'};
    const bc=i===0?'rgba(251,191,36,.25)':i===1?'rgba(148,163,184,.2)':i===2?'rgba(251,146,60,.2)':i<=4?'rgba(132,204,22,.2)':'rgba(100,116,139,.12)';
    rkHtml+=`<tr style="${isMe?'background:rgba(139,92,246,.08);border-left:3px solid #a78bfa;':''}border-bottom:0.5px solid rgba(45,58,82,.5)">
      <td style="padding:9px 10px"><span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:900;background:${bc};color:${rk.color}">${i+1}</span></td>
      <td style="padding:9px 10px;font-weight:${isMe?700:400}">${m.name}${isMe?' <span style="font-size:10px;color:#a78bfa">◀ 나</span>':''}</td>
      <td style="padding:9px 10px;font-family:\'DM Mono\',monospace;color:#10b981">+${wonFmt(m.actual-m.target)}</td>
      <td style="padding:9px 10px"><span style="font-size:11px;font-weight:700;color:${isMe?'#a78bfa':rk.color}">${rk.label}</span></td>
    </tr>`;
  });
  // 순위外
  DATA.filter(m=>getRate(m)>=100&&m.actual-m.target>=0&&m.actual-m.target<200000).forEach(m=>{
    const isMe=m.code===me.code;
    rkHtml+=`<tr style="${isMe?'background:rgba(139,92,246,.08);border-left:3px solid #a78bfa;':''}border-bottom:0.5px solid rgba(45,58,82,.5);opacity:.75">
      <td style="padding:8px 10px"><span style="font-size:10px;background:rgba(16,185,129,.15);color:#10b981;padding:2px 6px;border-radius:5px">外</span></td>
      <td style="padding:8px 10px;font-size:12px;font-weight:${isMe?700:400}">${m.name}${isMe?' <span style="font-size:10px;color:#a78bfa">◀ 나</span>':''}</td>
      <td style="padding:8px 10px;font-family:\'DM Mono\',monospace;font-size:12px;color:var(--dim)">+${wonFmt(m.actual-m.target)}</td>
      <td style="padding:8px 10px;font-size:11px;color:#10b981">올리브영 3만</td>
    </tr>`;
  });
  rkHtml+=`</tbody></table>`;

  // 합계 HTML
  const sumHtml=`
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px">
      ${CARD('순증 시상',spv,'#fbbf24')}
      ${CARD('주유권 (조기마감)',yuv,'#fbbf24')}
      ${CARD('곱빼기 시상',gbv,'#a78bfa')}
      ${CARD('순위 시상',rkv,me._rk?me._rk.color:'#64748b')}
    </div>
    <div style="background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(6,182,212,.07));border:1px solid rgba(16,185,129,.2);border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:13px;font-weight:700">🎁 예상 시상 합계</span>
      <span style="font-family:'DM Mono',monospace;font-size:22px;font-weight:700;color:#10b981">${wonFmt(total)}</span>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.9">
      ※ 주유권은 6월 19일 조기마감 달성 시 추가 지급<br>
      ※ 곱빼기 시상은 최종 실적 40만원↑ 조건<br>
      ※ 순위 시상은 최종 확정 후 지급
    </div>`;

  // D-Day 배너
  const ddayBanner=`<div style="background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(239,68,68,.07));border:1px solid rgba(245,158,11,.22);border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
    <div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">⏰ 조기마감 (6월 19일) — 주유권 추가 지급 기한</div>
      <div style="display:flex;align-items:baseline;gap:6px">
        <span style="font-family:'DM Mono',monospace;font-size:26px;font-weight:900;color:${dc}">D-${dday}</span>
        <span style="font-size:13px;color:var(--muted)">일 남음</span>
      </div>
    </div>
    <div style="text-align:right;font-size:12px;color:#fbbf24">10만원↑ 주유권 4만원<br>100만원↑ 주유권 60만원</div>
  </div>`;

  const cardStyle='background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;';
  const secTitle=(t,sub)=>`<div style="font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--muted);margin-bottom:12px">${t}${sub?` <span style="font-weight:400;color:var(--muted)">${sub}</span>`:''}</div>`;

  panel.innerHTML=`
    ${ddayBanner}
    <div style="${cardStyle}">
      ${secTitle('📊 나의 실적 현황')}
      ${summaryHtml}
    </div>
    <div style="${cardStyle}">
      ${secTitle('🏆 인보험 월납 순증 시상')}
      ${spHtml}
    </div>
    <div style="${cardStyle}">
      ${secTitle('💎 곱빼기 시상','(최종 실적 40만원↑ 조건)')}
      ${gobHtml}
    </div>
    <div style="${cardStyle}">
      ${secTitle('🥇 순증 순위 시상','(순증 20만원↑ 달성자 중)')}
      ${rkHtml}
    </div>
    <div style="${cardStyle}">
      ${secTitle('🎁 예상 시상금 합계')}
      ${sumHtml}
    </div>`;
}

window.renderAwardFor=(code)=>{
  const content=document.getElementById('award-content');
  if(!content||!code)return;
  const m=DATA.find(d=>d.code===code);
  if(!m){content.innerHTML='';return;}
  // 임시로 세션 코드를 바꿔서 렌더 후 복원
  const origCode=currentSession.code;
  currentSession.code=code;
  const tempPanel=document.createElement('div');
  renderAward(tempPanel);
  content.innerHTML=tempPanel.innerHTML;
  currentSession.code=origCode;
};

// ── 공지사항
function renderNoticePanel(panel){
  panel.innerHTML=`
    <div style="background:rgba(249,115,22,.07);border:1px solid rgba(249,115,22,.2);color:#fb923c;margin:12px 16px 0;padding:10px 14px;border-radius:8px;font-size:12px;display:flex;gap:8px;align-items:center;">
      <span>📢</span><span>클릭하면 내용이 펼쳐집니다.</span>
    </div>
    <div style="padding:14px" id="notice-list"><div style="text-align:center;padding:24px;color:var(--muted);font-size:13px">불러오는 중...</div></div>
    <div class="table-footer"><span id="notice-count">—</span><span style="font-family:'DM Mono',monospace;font-size:10px">MASTER COURSE 2026</span></div>`;
  loadNotices();
}

// ── 관리자
function renderAdmin(panel){
  const now=new Date().toLocaleTimeString('ko-KR');
  const statusText=DATA.length>0?`✅ ${DATA.length}명 · ${now}`:'⚠️ 데이터 없음';
  const statusColor=DATA.length>0?'var(--green)':'var(--gold2)';
  panel.innerHTML=`
    <div class="admin-section">
      <h3>📊 구글 시트 연동 상태</h3>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <div id="sheet-status" style="font-size:13px;color:${statusColor}">${statusText}</div>
      <button onclick="loadFromSheet()" style="background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;padding:9px 18px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;color:#fff;cursor:pointer;">🔄 새로고침</button>
      </div>
      <div class="csv-guide" style="margin-top:14px">
        <div style="color:var(--accent2);font-weight:500;margin-bottom:4px">▸ 구글 시트 컬럼 순서 (A~R열)</div>
        지점명(A), 이름(B), 코드(C), 차월(D), 기준목표(E), 실적진도(F),<br>
        신규LMS동의(G), 행복보장분석(H), 설계건수(I), 발행건수(J),<br>
        오케이판매건수(K), 오케이판매금액(L), 품격판매건수(M), 품격판매금액(N),<br>
        제공건수(O), DB LMS동의(P), DB행복보장분석(Q), 가입설계건수(R),<br>
        <span style="color:var(--green)">어제실적(S) ← 매일 업무 시작 전 F열 값을 복사해서 붙여넣기</span><br>
        <span style="color:var(--muted)">※ 금액은 원 단위 숫자로 입력</span>
      </div>
    </div>
    <div class="admin-section">
      <h3>📢 공지사항 시트 연결</h3>
      <div class="csv-guide">
        <div style="color:var(--orange2);font-weight:500;margin-bottom:4px">▸ 공지사항 시트 컬럼 (A~E열)</div>
        제목, 날짜, 고정여부(Y/N), NEW여부(Y/N), 내용
      </div>
    </div>`;
}

// ── 모달
window.openModal=(type)=>{
  const rates=DATA.map(m=>({...m,rate:getRate(m)}));
  const body=document.getElementById('modal-body');
  const title=document.getElementById('modal-title');
  const sub=document.getElementById('modal-sub');
  body.innerHTML='';
  if(type==='avg'){
    const totT=DATA.reduce((s,m)=>s+m.target,0);
    const totA=DATA.reduce((s,m)=>s+m.actual,0);
    const avg=Math.round(totA/totT*100);
    title.textContent='전체 달성 현황';
    sub.textContent=`${DATA.length}명`;

    // 전체 합계 카드 3개
    const summary=document.createElement('div');
    summary.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px;';
    [{label:'전체 목표',val:wonFmt(totT),color:'var(--dim)'},
     {label:'총 실적', val:wonFmt(totA),color:'var(--accent2)'},
     {label:'달성율',  val:avg+'%',     color:avg>=100?'#10b981':avg>=70?'#f59e0b':'#ef4444'},
    ].forEach(item=>{
      const c=document.createElement('div');
      c.style.cssText='background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:14px;text-align:center;';
      c.innerHTML=`<div style="font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:700;letter-spacing:.06em">${item.label}</div>
        <div style="font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:${item.color}">${item.val}</div>`;
      summary.appendChild(c);
    });
    body.appendChild(summary);
    const groups=[
      {label:'100% 미달',color:'var(--red)',   filter:r=>r.rate<100},
      {label:'100% 달성',color:'var(--green)', filter:r=>r.rate>=100&&r.rate<120},
      {label:'120% 달성',color:'var(--accent2)',filter:r=>r.rate>=120&&r.rate<150},
      {label:'150% 이상',color:'var(--gold2)', filter:r=>r.rate>=150},
    ];
    const grid=document.createElement('div');
    grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;';
    groups.forEach(g=>{
      const members=rates.filter(g.filter);
      const card=document.createElement('div');
      card.style.cssText=`background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:13px 15px;`;
      card.innerHTML=`<div style="font-size:10px;font-weight:700;letter-spacing:.07em;color:${g.color};margin-bottom:7px">${g.label}</div>
        <div style="font-family:'DM Mono',monospace;font-size:24px;font-weight:500;color:${g.color};line-height:1">${members.length}<span style="font-size:13px;margin-left:3px;color:var(--muted)">명</span></div>
        <div style="margin-top:9px;display:flex;flex-direction:column;gap:4px">
          ${members.length?members.map(m=>`<div style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.03);border-radius:6px;padding:5px 9px;">
            <div><span style="font-weight:600;font-size:12px">${m.name}</span><span style="font-size:10px;color:var(--muted);margin-left:5px">${m.branch}</span></div>
            <span style="font-family:'DM Mono',monospace;font-size:11px;color:${g.color}">${m.rate}%</span>
          </div>`).join(''):`<div style="font-size:11px;color:var(--muted)">해당 없음</div>`}
        </div>`;
      grid.appendChild(card);
    });
    body.appendChild(grid);
    const ct=document.createElement('div');
    ct.style.cssText='font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--muted);margin-bottom:9px';
    ct.textContent='개인별 달성율 (실적 높은 순)';
    body.appendChild(ct);
    [...rates].sort((a,b)=>b.actual-a.actual).forEach(m=>{
      const pct=Math.min(m.rate,100);
      const color=m.rate>=150?'#f59e0b':m.rate>=120?'#06b6d4':m.rate>=100?'#10b981':'#ef4444';
      const row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:9px;margin-bottom:7px';
      row.innerHTML=`<span style="font-size:12px;font-weight:600;min-width:55px">${m.name}</span>
        <span style="font-size:10px;color:var(--muted);min-width:45px">${m.branch}</span>
        <div style="flex:1;height:7px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${color};border-radius:99px"></div></div>
        <span style="font-family:'DM Mono',monospace;font-size:11px;color:${color};min-width:38px;text-align:right">${m.rate}%</span>`;
      body.appendChild(row);
    });
  } else if(type==='award1'){
    const members=rates.filter(r=>r.rate>=100).sort((a,b)=>b.rate-a.rate);
    title.textContent='✅ 기준달성 인원';
    sub.textContent=`달성율 100% 이상 · ${members.length}명`;
    renderAwardList(body,members,'#10b981');
  } else if(type==='award2'){
    const members=rates.filter(r=>r.rate>=200).sort((a,b)=>b.rate-a.rate);
    title.textContent='🎉 곱빼기달성 인원';
    sub.textContent=`달성율 200% 이상 · ${members.length}명`;
    renderAwardList(body,members,'#f87171');
  }
  document.getElementById('modal-backdrop').style.display='block';
  document.getElementById('modal').style.display='block';
};

function renderAwardList(body,members,color){
  if(!members.length){body.innerHTML=`<div style="text-align:center;color:var(--muted);padding:28px;font-size:13px">해당 인원 없음</div>`;return;}
  members.forEach((m,i)=>{
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 15px;margin-bottom:8px';
    row.innerHTML=`<div style="display:flex;align-items:center;gap:10px">
      <div style="width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${color}">${i+1}</div>
      <div><span style="font-weight:700;font-size:14px">${m.name}</span><span style="font-size:11px;color:var(--muted);margin-left:6px">${m.branch}</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)">${wonFmt(m.actual)} / ${wonFmt(m.target)}</span>
      <span style="font-family:'DM Mono',monospace;font-size:15px;font-weight:600;color:${color}">${m.rate}%</span>
    </div>`;
    body.appendChild(row);
  });
}

window.closeModal=()=>{
  document.getElementById('modal-backdrop').style.display='none';
  document.getElementById('modal').style.display='none';
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// ── 초기 로드
loadFromSheet();
</script>
</body>
</html>
